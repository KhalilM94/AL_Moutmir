# Every measured lab value. A column named here is NEVER a feature, whether or not a model is
# being fitted for it. This is what makes a joint static+targets file safe: without it, commenting
# a target out of TARGET_COLUMNS silently promotes it to a predictor of the remaining targets.
LABEL_COLUMNS:
  - sand_pct
  - clay_pct
  - total_silt_pct
  - fine_silt_pct
  - coarse_silt_pct
  - coarse_element_pct
  - ph_water
  - caco3_pct_total
  - caco3_active_pct
  - c_e_c_meq_100g
  - ce_ext1_5_ms_cm
  - na2o_ppm
  - cl_ppm
  - na_meq_100g
  - c_n_ratio
  - organic_matter_pct
  - organic_matter_g_kg
  - exchangeable_k2o_ppm
  - p2o5_ehangable_olsen_ppm
  - mgo_ppm
  - cao_ppm
  - iron_ppm_dtpa
  - mn_ppm_dtpa
  - cu_ppm_dtpa
  - zn_ppm_dtpa
  - b_ppm_hot_water
  # - total_silt_pct__soil_cnn
  # - c_e_c_meq_100g__soil_cnn
  # - caco3_pct_total__soil_cnn
  # - c_n_ratio__soil_cnn

# Whether the measured values above travel with the data as AUXILIARY INPUTS. This changes
# availability only: every LABEL_COLUMNS entry stays out of the feature set either way, because
# metadata_columns drops them by name for all three paths. What it enables is a model naming one
# explicitly - see soil_cnn's auxiliary_label_columns - for the case where the value is genuinely
# measured at prediction time too.
#
# Needed because targets live in their own file here: the join carries only the ACTIVE targets
# unless asked otherwise, so without this a model could select organic_matter_g_kg and nothing else,
# while the same declaration on a joint static+targets file would offer all 24.
CARRY_LABEL_COLUMNS: true

# The subset of LABEL_COLUMNS to actually fit models for in this run. A name on either side is
# treated as a label and kept out of the features; only these get models fitted.
TARGET_COLUMNS:
  - organic_matter_g_kg
  # - clay_pct
  # - sand_pct
  # - total_silt_pct
  # - ph_water
  # - caco3_pct_total
  # - c_e_c_meq_100g
  # - c_n_ratio
  # - p2o5_ehangable_olsen_ppm

# How several targets become models. Ignored when TARGET_COLUMNS has one entry.
#   joint       one model with a target_dim-wide head over every target, sharing a representation
#   per_target  one independent model per target
# Both families obey this. A registry entry may override it with its own `multi_target:` key; an
# sklearn entry must additionally declare `multi_target: native` to be eligible for a joint fit,
# since most scikit estimators cannot take a 2-D y.
MULTI_TARGET_MODE: joint

PREDICTOR_COLUMNS: []

# Metadata only. Lab values live in LABEL_COLUMNS and no longer need blacklisting here.
IGNORED_COLUMNS: &ignored_columns
  - point_id
  - lat
  - lon
  - geometry
  - uuid
  - cluster
  - date
  # - texture_20cm
  # - landform_class
  - bd_median_0_30cm
  - clay_median_0_30cm
  - ph_median_0_30cm
  - sand_median_0_30cm
  - soc_median_0_30cm
  - swc_median_0_30cm
  - ClimDef_trend_slope
  - SM_trend_slope
  - ETa_trend_slope
  # - organic_matter_g_kg__soil_cnn
  # - clay_pct__soil_cnn
  # - ph_water__soil_cnn
  # - sand_pct__soil_cnn
  # - total_silt_pct__soil_cnn
  # - caco3_pct_total__soil_cnn
  # - c_n_ratio__soil_cnn
  # - p2o5_ehangable_olsen_ppm__soil_cnn

ELIMINATED_FEATURES: *ignored_columns

CATEGORICAL_FEATURES:
  - texture_20cm
  - landform_class

existing_hs_features:
  enabled: false
  ignore: false
  prefix: ["S2_", "S1_asc","S1_desc", "SOIL_", "AG_", "CLIM_"]
  band_count: 6
  band_names: []
