# Lightning model registry. One top-level key per model, plus the reserved `defaults:` block below.
#
# `defaults:` is merged into every entry by Config._load_lightning_model_registry, key by key and
# recursing into nested mappings. An entry that names a key wins; anything it omits comes from here.
# So an entry can write `trainer_args: {max_epochs: 150}` and keep the rest of the shared trainer
# args. What is left on an entry is what actually distinguishes it from the others.
#
# Every stack of layers is an explicit list of per-layer widths - `head_hidden_dims: [64, 32]`,
# `static_hidden_dims: [64]`, `cnn_hidden_dims: [128, 128]`. The list IS the depth: there is no
# separate layer count and no taper rule to reconstruct, so the built network is what the config
# says. The hyperparameter search draws such a list with the `dims_pyramid` hook; see
# hpo/constraints.py and the header of search_spaces.yml.
defaults:
  modeltype: dl
  trainer_args:
    max_epochs: 500         # the graph run stopped after 420 optimizer steps, still improving
    accelerator: cuda
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0  # 3-layer LSTMs over 108 steps were running unclipped
    log_every_n_steps: 5
    enable_checkpointing: true
    deterministic: true
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 100          # 10 fired on ties/noise while train_loss was still falling
    checkpoint:
      monitor: val_loss
      mode: min
      save_top_k: 1
  datamodule_init_args:
    batch_size: 32
    # val_size / test_size / seed deliberately absent. The train/val/test split is decided ONCE for
    # every training family in main_config.yml's `split:` block, and injected here as a split_plan.
    # Setting them here is what used to shadow common.TEST_SIZE - editing that key moved only the
    # sklearn holdout while this file silently kept Lightning on its own, overlapping one.
    target_transform: log1p # null | log1p (log1p also standardizes in transformed space)
    num_workers: 11         # collate pickles the whole datamodule per worker
    pin_memory: false
    persistent_workers: false
    shuffle: true
  tags:
    framework: lightning
    family: regression

# Static covariates + one CNN per modality over a rasterised (years x months) calendar grid.
#
# Convolution needs a regular lattice, so the model scatters each ragged, date-stamped reading into
# the (year, month) cell its date names. Rows are counted back from each point's OWN latest
# observation and columns are calendar months, so nothing is tied to a date range. grid_years is
# inferred from the data, and adaptive pooling means no weight depends on it.
soil_cnn:
  enabled: false
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_cnn_lightning_module.SoilCNNLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto                    # CONTINUOUS covariates only; categoricals are embedded
    target_dim: auto
    modality_dims: auto
    grid_years: auto                    # inferred: 9 on this dataset, 1 on a one-year dataset

    # --- categorical covariates: learned entity embeddings ---
    # Declared by CATEGORICAL_FEATURES in data_spec.yml. The vocabulary is fitted on the TRAIN split
    # only and travels in the checkpoint, so an unseen category at inference lands on the reserved
    # index 0 rather than silently taking some other category's row.
    categorical_cardinalities: auto     # len(train vocabulary) + 1 per feature
    categorical_vocabularies: auto      # carried into hparams: makes the checkpoint self-describing
    categorical_feature_names: auto
    embedding_dims: auto                # auto = min(embedding_max_dim, (cardinality + 1) // 2)
    embedding_max_dim: 50               # the cap in that heuristic
    embedding_dropout: 0.0              # dropout on the CONCATENATED embedding vector
    continuous_norm: none               # none | batch | layer, on the continuous block pre-concat

    # dilated_tempcnn : Conv1d(k=3,d=1) then Conv1d(k=3,pad=12,d=12), month t <-> month t-12
    # annual_grid2d   : Conv2d((1,3)) across months, then Conv2d((3,1)) across years
    temporal_encoder: dilated_tempcnn
    # One width per conv block, walked in order: [128, 128] is two blocks of 128. The list IS the
    # depth. A conv stack conventionally widens as it pools, which [64, 128] expresses and a single
    # shared width could not. May also be a per-modality mapping, {s2: [64, 128], s1: [32], ...}.
    cnn_hidden_dims: [128, 128]
    modality_embed_dim: 64              # scalar, or a per-modality mapping
    cnn_norm: batch                     # batch | group | none (group avoids empty-cell pollution)
    pool: masked_avg                    # masked_avg | avg  (avg = the literal AdaptiveAvgPool)
    month_positional: false             # sin/cos month channels; without them pooling loses position
    use_validity_channels: true         # per-channel measured-vs-median-filled flags

    # --- measured lab values as extra inputs (OFF by default) ---
    # Appends already-measured soil properties to the fused vector, just before the head. This is a
    # deliberate opt-out of the rule that a LABEL_COLUMNS entry is never a feature, so it is only
    # sound when the named values are genuinely measured at prediction time too - e.g. predicting
    # organic matter for a sample whose texture and pH came back from the lab. Naming a column that
    # is also in TARGET_COLUMNS raises rather than being quietly dropped.
    # Missing values are filled from the TRAIN-split median and flagged; a column like mgo_ppm is
    # ~32% absent, so check the builder's startup log before selecting one.
    auxiliary_label_columns: []         # e.g. [clay_pct, ph_water]; [] disables the branch entirely
    auxiliary_available_names: auto     # the roster the names resolve against; recorded in hparams
    auxiliary_validity_channels: true   # per-column measured-vs-filled flags, doubling the width
    # [] = concat the standardized values straight onto the fused vector. A non-empty list inserts
    # Linear/LayerNorm/GELU blocks of those widths first, so a handful of lab columns cannot be
    # swamped by a 384-wide fused vector - and the head's width stops tracking the column count.
    auxiliary_hidden_dims: []
    auxiliary_dropout: 0.0              # only applies inside those blocks

    static_hidden_dims: [64]            # one width per block; [128, 64] deepens the static branch
    # Widths per block, then the readout: 384 -> 64 -> 1. GELU per block; LayerNorm on every block
    # EXCEPT the one feeding the readout, so a single-layer head like this one carries no norm at
    # all unless head_norm_final is set.
    head_hidden_dims: [64]
    head_norm_final: false              # true restores LayerNorm on the block feeding the readout
    dropout: 0.2                        # one knob: static encoder, every conv block, AND the head

    loss_name: mse                      # mse | huber | smooth_l1
    huber_delta: 1.0
    learning_rate: 0.00017098640419999995
    temporal_enabled: true
    optimizer_name: adamw
    weight_decay: 1.146047247855197e-06
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 20              # counted in EPOCHS
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
  datamodule_init_args:
    max_sequence_length: null           # tail-truncate very long series; null keeps everything
  tags:
    architecture: calendar-grid-cnn

# Static covariates + one sequence encoder per modality, blended by a learned gate. No graph.
#
# Sequences are ragged and date-stamped: each point carries only its real observations, padded per
# batch. Nothing here is tied to a number of steps or to a date range, so a trained checkpoint runs
# on any future window with different lengths and a different cadence.
soil_sequence:
  enabled: false
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_sequence_lightning_module.SoilSequenceLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto                     # CONTINUOUS covariates only; categoricals are embedded
    target_dim: auto
    modality_dims: auto
    # No temporal_steps and no edge_attr_dim on purpose: the model is length-agnostic and graph-free,
    # and the sequence datamodule exposes neither, so the factory cannot inject them.

    # --- categorical covariates: learned entity embeddings ---
    # Declared by CATEGORICAL_FEATURES in data_spec.yml. The vocabulary is fitted on the TRAIN split
    # only and travels in the checkpoint, so an unseen category at inference lands on the reserved
    # index 0 rather than silently taking some other category's row.
    categorical_cardinalities: auto      # len(train vocabulary) + 1 per feature
    categorical_vocabularies: auto       # carried into hparams: makes the checkpoint self-describing
    categorical_feature_names: auto
    embedding_dims: auto                 # auto = min(embedding_max_dim, (cardinality + 1) // 2)
    embedding_max_dim: 50                # the cap in that heuristic
    embedding_dropout: 0                 # dropout on the CONCATENATED embedding vector
    continuous_norm: none                # none | batch | layer, on the continuous block pre-concat

    temporal_encoder: time_transformer   # time_transformer | time_lstm
    modality_embed_dim: 64               # scalar, or a per-modality mapping like lstm_hidden_dim
    fusion_dim: 64
    static_hidden_dims: [64]

    # --- time_transformer branch: Time2Vec positions + [CLS] pooling ---
    d_model: 48                          # must be divisible by nhead
    nhead: 4
    num_layers: 2
    time2vec_dim: 8
    # --- time_lstm branch: calendar/gap channels + masked pooling ---
    lstm_hidden_dim: 64
    lstm_num_layers: 1
    lstm_bidirectional: false
    temporal_pooling: mean_max_last      # mean_max_last | last | attention

    span_cap_years: 8.0                  # relative-age saturation, NOT a date range
    delta_cap_months: 24.0               # gap saturation
    dropout: 0.1

    # --- post-fusion depth: [] = a single Linear(fusion -> target) ---
    head_hidden_dims: [64]
    use_layer_norm: true
    # batch | layer | none. BatchNorm1d normalizes per feature across the batch and preserves the
    # per-sample magnitude a regressor needs; LayerNorm here erases it and caps how far predictions
    # can move from the target mean.
    fusion_norm_type: batch

    loss_name: mse                       # mse | huber | smooth_l1
    huber_delta: 1.0
    learning_rate: 0.01
    temporal_enabled: true
    optimizer_name: adamw
    weight_decay: 0.005
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 10               # counted in EPOCHS
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
  datamodule_init_args:
    max_sequence_length: null            # tail-truncate very long series; null keeps everything
  tags:
    architecture: static-dynamic-sequence

# Static covariates only - no temporal branch. The control for "what does the time series buy?",
# sharing the datamodule, the loss and the optimizer with the two models above so the difference is
# the temporal pathway and nothing else. enabled:false by default; turn it on to measure.
soil_tabular:
  enabled: false
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_tabular_lightning_module.SoilTabularLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto                     # CONTINUOUS covariates only; categoricals are embedded
    target_dim: auto

    categorical_cardinalities: auto
    categorical_vocabularies: auto
    categorical_feature_names: auto
    embedding_dims: auto                 # auto = min(embedding_max_dim, (cardinality + 1) // 2)
    embedding_max_dim: 50
    embedding_dropout: 0.3
    continuous_norm: batch                # none | batch | layer

    static_hidden_dims: [64]
    head_hidden_dims: [256, 256, 128, 64, 32]  # 256 -> 256 -> 128 -> 64 -> 32 -> 1
    dropout: 0.1
    activation: relu                     # relu | gelu
    use_layer_norm: true

    loss_name: mse
    huber_delta: 1.0
    learning_rate: 0.001
    optimizer_name: adamw
    weight_decay: 0.0001
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 20
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
  tags:
    architecture: tabular-entity-embeddings

# Superseded by soil_sequence. Kept enabled:false so the dense-axis baseline stays reproducible -
# see lightning_logs/version_79 for the R2 ~= 0.20 reference run.
soil_graph:
  enabled: false
  input_kind: graph
  import_path: yg_eo_soilnet.models.lightningmodules.soil_graph_lightning_module.SoilGraphLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.lightning.lightning_graph.SingleNodeGraphDataModule
  init_args:
    static_dim: auto
    target_dim: auto
    modality_dims: auto
    temporal_steps: auto
    edge_attr_dim: auto
    num_graph_layers: 1              # spatial_graph_enabled is false, so these blocks never run

    # --- per-branch width: size each branch to its own channel count ---
    static_hidden_dims: [32]         # 13 covariates -> 32   (was 11 -> 64, a 5.8x blow-up)
    temporal_lstm_num_layers: 1
    temporal_lstm_dropout: 0.1       # was 0.0; active since temporal_lstm_num_layers > 1
    temporal_lstm_bidirectional: false
    temporal_pooling: last
    temporal_lstm_hidden_dim:        # a scalar here applies one width to every modality
      s2: 48                         # 10 channels
      s1: 32                         #  8 channels
      soil: 16                       #  3 channels  (was 3 -> 64, a 21x blow-up)
      ag: 16                         #  3 channels
      clim: 16                       #  3 channels
    # fused vector: 32 + (48+32+16+16+16) = 160   (was 384)

    # --- post-concat depth: [] = a single Linear(fusion -> target) ---
    head_hidden_dims: [64, 32, 32]   # 160 -> 64 -> 32 -> 32 -> 1
                                     # The block feeding the readout carries no norm/dropout, so the
                                     # final Linear still sees an unnormalized vector.

    # --- normalization (static encoder, head, graph blocks) ---
    use_layer_norm: true
    # batch | layer | none. BatchNorm1d normalizes per feature across the batch and preserves the
    # per-sample magnitude a regressor needs; LayerNorm here erases it and caps how far predictions
    # can move from the target mean.
    fusion_norm_type: batch

    # --- loss: mse | huber | smooth_l1 (huber_delta is the Huber delta / SmoothL1 beta) ---
    loss_name: mse
    huber_delta: 1.0

    dropout: 0.1                     # was 0.0
    learning_rate: 0.001
    temporal_enabled: true
    spatial_graph_enabled: false
    optimizer_name: adamw
    weight_decay: 0.0001
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 20           # counted in EPOCHS; at ~23 steps/epoch that is ~460 steps
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
  datamodule_init_args:
    batch_size: 32                   # 512 over ~2.9k train nodes was only 6 optimizer steps/epoch
  graph_data_args:
    convert_coordinates_to_utm: true
    coordinate_crs: EPSG:4326
    spatial_radius: 5000
    baseline_method: knn
    baseline_k_neighbors: 20
  tags:
    architecture: single-node-graph
