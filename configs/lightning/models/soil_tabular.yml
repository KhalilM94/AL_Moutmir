# Part of the Lightning (deep-learning) model registry. Settings shared by every model live in
# defaults.yml in this same folder; this file holds only what makes soil_tabular different from
# the rest, alongside its siblings here (soil_cnn.yml, soil_residual_cnn.yml,
# soil_residual_attention_cnn.yml, soil_sequence.yml, soil_graph.yml). To register another model,
# add a new .yml file in this folder, named after the model, with the model name as its top-level
# key - it's picked up automatically.
#
# How defaults work: settings in defaults.yml's `defaults:` block apply to every model, unless
# this file sets that same setting itself (which then wins). So this file only needs to list what
# makes soil_tabular different from the rest - anything it doesn't mention falls back to those
# defaults.
#
# A note on network "shape" settings you'll see in this file, like `head_hidden_dims: [64, 32]`:
# these describe a stack of layers as a list of widths, one number per layer. The LENGTH of the
# list is how many layers there are, and each number is how wide that layer is - so [64, 32] means
# two layers, the first with 64 units and the second with 32. There's no separate "number of
# layers" setting anywhere; the list itself is the whole shape. (When these are searched
# automatically during hyperparameter tuning, that's done with a `dims_pyramid` helper - see
# configs/lightning/search_spaces/.)

# Uses ONLY your static (non-time-series) features - no time-series branch at all. This is the
# baseline for answering "does the time-series data actually help?": it shares the same data
# pipeline, loss, and optimizer setup as soil_sequence.yml and soil_cnn.yml, so any difference in
# accuracy comes purely from having (or not having) the time-series information. Off by default -
# turn it on alongside a temporal model to compare them.
soil_tabular:
  enabled: false
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_tabular_lightning_module.SoilTabularLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto                     # see soil_cnn.yml for what these `auto` settings mean
    target_dim: auto

    # --- categorical features: learned embeddings (see soil_cnn.yml) -------------------------------
    categorical_cardinalities: auto
    categorical_vocabularies: auto
    categorical_feature_names: auto
    embedding_dims: auto                 # auto = min(embedding_max_dim, half of the category count)
    embedding_max_dim: 50
    embedding_dropout: 0.3
    continuous_norm: batch                # none | batch | layer

    static_hidden_dims: [64]
    head_hidden_dims: [256, 256, 128, 64, 32]  # a 5-layer head: 256 -> 256 -> 128 -> 64 -> 32 ->
                                                # prediction (see head_hidden_dims in soil_cnn.yml)
    dropout: 0.1
    activation: relu                     # the nonlinearity used between layers: relu | gelu
                                          # (relu is the classic default; gelu is smoother and used
                                          # in many modern architectures)
    use_layer_norm: true

    # --- loss and optimizer: see soil_cnn.yml for details -------------------------------------------
    loss_name: mse
    huber_delta: 1.0
    loss_base: mse
    loss_lambda: 0.1
    loss_shrinkage: 0.05
    loss_min_batch: 16
    cosine_space: original
    learning_rate: 0.001
    optimizer_name: adamw
    weight_decay: 0.0001
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 20
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
  tags:
    architecture: tabular-entity-embeddings
