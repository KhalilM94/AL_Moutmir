# This file defines what `tune.py` (Optuna-based hyperparameter search) is allowed to try for each
# model in lightning_registry.yml, and how. Each top-level key here matches an entry name in that
# registry.
#
# Quick glossary: Optuna runs many "trials" - each trial trains the model once with one particular
# combination of settings - and tries to find the combination that scores best. A "study" is one
# full run of many trials.
#
# Where a setting lands in the model registry is shown by its dotted prefix here:
#   model.<key>              -> that model's init_args
#   datamodule.<key>         -> that model's datamodule_init_args
#   trainer.<key>            -> that model's trainer_args
#   callbacks.<group>.<key>  -> that model's callbacks[group]
#
# Each model's search space below has these blocks:
#   objective  what metric to optimize, and whether higher or lower is better. The early-stopping
#              monitor is automatically switched to watch the same metric.
#   fixed      settings applied the SAME way to every trial - not searched, just pinned for the
#              whole study (e.g. a shorter max_epochs than a real production run would use, since
#              trials rely on being stopped early rather than run to completion).
#   params     the actual search space - the settings Optuna is allowed to vary, and the range or
#              choices for each one. `when:` makes a setting only apply in trials where an earlier
#              choice matches - e.g. only search LSTM settings in trials that actually chose the
#              LSTM encoder.
#   derive     named helper rules (defined in hpo/constraints.py) for relationships between
#              settings that are too complex to write directly as a plain search range. Write a
#              bare helper name, or `{name: {option: value}}` to pass it settings of its own.
#
# LAYER WIDTHS: every stack of layers in these models (the head, the static branch, the conv
# blocks) is set as a list of per-layer widths, where the list's length IS the number of layers -
# see the note at the top of lightning_registry.yml. Optuna can't directly search a "list" as one
# choice, so there are three ways to handle one of these settings here:
#
#   1. search it   derive: [{dims_pyramid: {key: model.head_hidden_dims, max_depth: 3,
#                                           widths: [32, 64, 128], taper: 0.5, floor: 16}}]
#                  This lets Optuna choose both a depth (how many layers) and a starting width, and
#                  then builds the full list by scaling that width down/up per layer by `taper`:
#                    taper 0.5   each layer roughly half the previous: 128 -> [128, 64, 32]
#                    taper 1.0   every layer the same width: 128 -> [128, 128, 128]
#                    taper 2.0   each layer roughly double: 32 -> [32, 64, 128]
#                  min_depth: 0 allows Optuna to try an empty list (no extra layers at all).
#   2. pin it      fixed: {model.head_hidden_dims: [64, 32]} - always this exact list, not searched
#   3. leave it    don't mention the setting at all, and the registry's own value is used unchanged
#
# Every OTHER width/depth-like setting is just an ordinary number and belongs directly under
# `params`, e.g.: modality_embed_dim, fusion_dim, d_model, nhead, num_layers, time2vec_dim,
# lstm_hidden_dim, lstm_num_layers.
#
# Careful: changing anything in this file changes which study `tune.py` continues. Studies are
# named based on a fingerprint of the search space, so editing `params`/`fixed`/`derive` here
# starts a brand-new study next time you run `tune.py`, rather than adding more trials to your
# existing one - and trials from the new study won't be directly comparable to the old one's
# results. (Changing `sampler`/`pruner` below does NOT trigger a new study, so those can be
# adjusted freely on an existing one.)
#
# Two kinds of setting can't be searched here, and will raise an error if you try:
#   - anything the pipeline works out automatically from your data (static_dim, target_dim,
#     categorical_*, grid_years, target_mean/scale/transform, ...) - letting Optuna choose a
#     different value for these would break the model's expected input/output shapes.
#   - val_size / test_size / seed under `params`, or split_plan anywhere - the train/val/test split
#     is decided ONCE for the whole run (and shared with the sklearn models too) in
#     main_config.yml's `split:` block. Letting it vary per trial would silently refit each trial's
#     preprocessing on different data, making trials impossible to compare fairly with each other
#     or with anything else on the leaderboard. To change the split, edit `split:` there instead -
#     it applies to the whole study at once.

# --- static features + categorical embeddings only; no time-series branch (soil_tabular) --------
soil_tabular:
  objective:
    metric: val_r2                     # R2 is scale-free (always roughly 0-1 regardless of the
                                        # target's units), so it stays comparable even if you also
                                        # experiment with different loss_name settings
    direction: maximize
  # `sampler` decides which combination of settings to try next each trial; `tpe` (used here) is a
  # common, effective general-purpose algorithm that learns from earlier trials' results rather
  # than trying combinations blindly at random.
  sampler: {name: tpe, seed: 42}
  # `pruner` stops a trial early if it's clearly doing worse than other trials at the same point in
  # training, so time isn't wasted training a bad combination all the way through.
  # n_startup_trials is how many trials run to completion first (so there's something to compare
  # against) before pruning kicks in; n_warmup_steps is how many epochs every trial always gets
  # before it becomes eligible to be pruned.
  pruner: {name: median, n_startup_trials: 5, n_warmup_steps: 10}

  fixed:
    trainer.max_epochs: 150            # shorter than a real production run (500) - trials rely on
                                        # the pruner above to cut short the ones that aren't working
    datamodule.num_workers: 4          # fewer than a production run (11) - each individual trial
                                        # doesn't need as much data-loading parallelism on its own
    # Kept off deliberately here - see persistent_workers in lightning_registry.yml for what it
    # normally does. During tuning specifically, restarting the data-loading workers each epoch is
    # cheap and avoids process-management issues across the many short-lived trials a study runs.
    datamodule.persistent_workers: false
    callbacks.early_stopping.patience: 20

  params:
    model.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    model.weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
    model.dropout: {type: float, low: 0.0, high: 0.5, step: 0.05}
    model.embedding_dropout: {type: float, low: 0.0, high: 0.3, step: 0.05}
    model.embedding_dims: {type: categorical, choices: ["auto", 8, 16, 32]}
    model.embedding_max_dim: {type: int, low: 8, high: 64, step: 8}
    model.continuous_norm: {type: categorical, choices: [none, batch, layer]}
    model.activation: {type: categorical, choices: [relu, gelu]}
    model.use_layer_norm: {type: categorical, choices: [true, false]}
    model.scheduler_patience: {type: int, low: 5, high: 30, step: 5}
    model.scheduler_factor: {type: float, low: 0.2, high: 0.8, step: 0.1}
    datamodule.batch_size: {type: categorical, choices: [16, 32, 64, 128]}

  derive:
    - dims_pyramid: {key: model.head_hidden_dims,   min_depth: 0, max_depth: 3,
                     widths: [32, 64, 128, 256], taper: 0.5, floor: 8}
    - dims_pyramid: {key: model.static_hidden_dims, min_depth: 1, max_depth: 2,
                     widths: [32, 64, 128, 256], taper: 1.0}

# --- static features + one sequence encoder per data source, blended by a learned gate (soil_sequence) ---
soil_sequence:
  objective:
    metric: val_r2
    direction: maximize
  sampler: {name: tpe, seed: 42}
  pruner: {name: median, n_startup_trials: 5, n_warmup_steps: 10}

  fixed:
    trainer.max_epochs: 150
    datamodule.num_workers: 4
    datamodule.persistent_workers: true
    callbacks.early_stopping.patience: 20

  params:
    model.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    model.weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
    model.dropout: {type: float, low: 0.0, high: 0.4, step: 0.05}
    model.embedding_dropout: {type: float, low: 0.0, high: 0.3, step: 0.05}
    model.continuous_norm: {type: categorical, choices: [none, batch, layer]}
    model.modality_embed_dim: {type: categorical, choices: [32, 64, 128]}
    model.fusion_dim: {type: categorical, choices: [32, 64, 128]}
    model.fusion_norm_type: {type: categorical, choices: [batch, layer, none]}
    model.use_layer_norm: {type: categorical, choices: [true, false]}
    model.scheduler_patience: {type: int, low: 5, high: 30, step: 5}
    datamodule.batch_size: {type: categorical, choices: [16, 32, 64]}

    # soil_sequence can use either a transformer or an LSTM as its temporal encoder (see
    # configs/lightning/models/soil_sequence.yml) - never both. `when:` keeps each branch's own
    # settings out of trials that didn't choose that branch, so an LSTM-only trial isn't scored on
    # random transformer settings it never actually used, and vice versa.
    model.temporal_encoder: {type: categorical, choices: [time_transformer, time_lstm]}
    model.nhead:
      {type: categorical, choices: [2, 4, 8], when: {model.temporal_encoder: time_transformer}}
    model.d_model:
      {type: categorical, choices: [32, 48, 64, 96, 128], when: {model.temporal_encoder: time_transformer}}
    model.num_layers:
      {type: int, low: 1, high: 4, when: {model.temporal_encoder: time_transformer}}
    model.time2vec_dim:
      {type: categorical, choices: [4, 8, 16], when: {model.temporal_encoder: time_transformer}}
    model.lstm_hidden_dim:
      {type: categorical, choices: [32, 64, 128], when: {model.temporal_encoder: time_lstm}}
    model.lstm_num_layers:
      {type: int, low: 1, high: 3, when: {model.temporal_encoder: time_lstm}}
    model.lstm_bidirectional:
      {type: categorical, choices: [true, false], when: {model.temporal_encoder: time_lstm}}
    model.temporal_pooling:
      {type: categorical, choices: [mean_max_last, last, attention], when: {model.temporal_encoder: time_lstm}}

  derive:
    - d_model_divisible_by_nhead        # keeps d_model and nhead compatible - the transformer
                                         # requires d_model to divide evenly by nhead
    # min_depth: 0 allows a trial to try the simplest possible head - a single layer straight to
    # the prediction, with no extra hidden layers.
    - dims_pyramid: {key: model.head_hidden_dims,   min_depth: 0, max_depth: 3,
                     widths: [32, 64, 128], taper: 0.5, floor: 16}
    - dims_pyramid: {key: model.static_hidden_dims, min_depth: 1, max_depth: 2,
                     widths: [32, 64, 128], taper: 1.0}

# --- static features + one CNN per data source, over a rasterised (year x month) grid (soil_cnn) ---
soil_cnn:
  objective:
    # This has to be exactly "val_loss" (not e.g. "mse") because that's the actual name the
    # training loop logs the metric under - naming anything else here means the pruner above would
    # never find the metric it's supposed to watch, and would prune every single trial. With this
    # model's loss_name: mse (in configs/lightning/models/soil_cnn.yml), val_loss ends up being the
    # mean squared error, measured in standardized/log1p space rather than the target's original units.
    metric: val_loss
    direction: minimize
  sampler: {name: tpe, seed: 42}
  pruner: {name: median, n_startup_trials: 5, n_warmup_steps: 10}

  fixed:
    trainer.max_epochs: 150
    datamodule.num_workers: 4
    datamodule.persistent_workers: true
    callbacks.early_stopping.patience: 20
    model.dropout: 0.3

  params:
    model.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    model.weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
    model.embedding_dropout: {type: float, low: 0.0, high: 0.3, step: 0.05}
    model.continuous_norm: {type: categorical, choices: [none, batch, layer]}
    model.temporal_encoder: {type: categorical, choices: [dilated_tempcnn, annual_grid2d]}
    model.modality_embed_dim: {type: categorical, choices: [32, 64, 128, 256]}
    model.cnn_norm: {type: categorical, choices: [batch, group, none]}
    model.pool: {type: categorical, choices: [masked_avg, avg]}
    model.month_positional: {type: categorical, choices: [true, false]}
    model.use_validity_channels: {type: categorical, choices: [true, false]}
    model.head_norm_final: {type: categorical, choices: [true, false]}
    model.scheduler_patience: {type: int, low: 5, high: 30, step: 5}
    datamodule.batch_size: {type: categorical, choices: [16, 32, 64]}

  derive:
    - dims_pyramid: {key: model.head_hidden_dims,   min_depth: 0, max_depth: 5,
                     widths: [32, 64, 128, 256], taper: 0.5, floor: 8}
    - dims_pyramid: {key: model.static_hidden_dims, min_depth: 1, max_depth: 5,
                     widths: [32, 64, 128, 256], taper: 1.0}
    # taper: 1.0 means every conv layer in the stack gets tried at the same width. Raise it toward
    # 2.0 if you also want to search stacks that widen from one layer to the next.
    - dims_pyramid: {key: model.cnn_hidden_dims,    min_depth: 1, max_depth: 5,
                     widths: [16, 32, 64, 128, 256], taper: 1.0}
    # min_depth: 0 lets a trial try feeding the auxiliary lab values in as-is, with no extra layers
    # (see auxiliary_hidden_dims in configs/lightning/models/soil_cnn.yml). This is commented out
    # because it has no effect unless auxiliary_label_columns is also set to a non-empty list -
    # with that feature off, there's nothing here to search.

    # - dims_pyramid: {key: model.auxiliary_hidden_dims, min_depth: 0, max_depth: 2,
                    #  widths: [16, 32, 64], taper: 1.0}

# --- soil_cnn with the head anchored on an existing prediction (soil_residual_cnn) --------------
# The same search space as soil_cnn above, plus a setting for the width of the residual-base block
# (see configs/lightning/models/soil_residual_cnn.yml). Note residual_base_columns itself is NOT
# searched here - which column is the "base" to correct is a fixed choice about your data, not a
# hyperparameter, and letting a trial pick a different one would mean each trial is solving a
# different problem.
# Also note the objective below is a RESIDUAL-space val_loss (the model is scored on how well it
# predicts the correction, not the target itself), so these numbers are not directly comparable to
# the plain soil_cnn study's.
soil_residual_cnn:
  objective:
    metric: val_loss
    direction: minimize
  sampler: {name: tpe, seed: 42}
  pruner: {name: median, n_startup_trials: 5, n_warmup_steps: 10}

  fixed:
    trainer.max_epochs: 150
    datamodule.num_workers: 4
    datamodule.persistent_workers: true
    callbacks.early_stopping.patience: 20
    model.dropout: 0.3

  params:
    model.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    model.weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
    model.embedding_dropout: {type: float, low: 0.0, high: 0.3, step: 0.05}
    model.continuous_norm: {type: categorical, choices: [none, batch, layer]}
    model.temporal_encoder: {type: categorical, choices: [dilated_tempcnn, annual_grid2d]}
    model.modality_embed_dim: {type: categorical, choices: [32, 64, 128, 256]}
    model.cnn_norm: {type: categorical, choices: [batch, group, none]}
    model.pool: {type: categorical, choices: [masked_avg, avg]}
    model.month_positional: {type: categorical, choices: [true, false]}
    model.use_validity_channels: {type: categorical, choices: [true, false]}
    model.residual_base_validity_channels: {type: categorical, choices: [true, false]}
    model.residual_base_dropout: {type: float, low: 0.0, high: 0.3, step: 0.05}
    model.head_norm_final: {type: categorical, choices: [true, false]}
    model.scheduler_patience: {type: int, low: 5, high: 30, step: 5}
    datamodule.batch_size: {type: categorical, choices: [16, 32, 64]}

  derive:
    - dims_pyramid: {key: model.head_hidden_dims,   min_depth: 0, max_depth: 5,
                     widths: [32, 64, 128, 256], taper: 0.5, floor: 8}
    - dims_pyramid: {key: model.static_hidden_dims, min_depth: 1, max_depth: 5,
                     widths: [32, 64, 128, 256], taper: 1.0}
    - dims_pyramid: {key: model.cnn_hidden_dims,    min_depth: 1, max_depth: 5,
                     widths: [16, 32, 64, 128, 256], taper: 1.0}
    # min_depth: 0 lets a trial try feeding the residual base value in as-is, with no extra layers.
    # Unlike the equivalent auxiliary_hidden_dims search in soil_cnn above, this one always has an
    # effect - the residual-base block is required for this model and always built.
    - dims_pyramid: {key: model.residual_base_hidden_dims, min_depth: 0, max_depth: 2,
                     widths: [16, 32, 64], taper: 1.0}
