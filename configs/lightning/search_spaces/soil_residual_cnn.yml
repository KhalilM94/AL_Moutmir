# This file defines the shared rules for what `tune.py` (Optuna-based hyperparameter search) is
# allowed to try. Each model's own search space lives in its own file under
# configs/lightning/search_spaces/, named after the entry it tunes in configs/lightning/models/ - add a new
# .yml file there, named after the model, with the model name as its top-level key, to add a
# search space for another one.
#
# Quick glossary: Optuna runs many "trials" - each trial trains the model once with one particular
# combination of settings - and tries to find the combination that scores best. A "study" is one
# full run of many trials.
#
# Where a setting lands in the model registry is shown by its dotted prefix here:
#   model.<key>              -> that model's init_args
#   datamodule.<key>         -> that model's datamodule_init_args
#   trainer.<key>            -> that model's trainer_args
#   callbacks.<group>.<key>  -> that model's callbacks[group]
#
# Each model's search space file has these blocks:
#   objective  what metric to optimize, and whether higher or lower is better. The early-stopping
#              monitor is automatically switched to watch the same metric.
#   fixed      settings applied the SAME way to every trial - not searched, just pinned for the
#              whole study (e.g. a shorter max_epochs than a real production run would use, since
#              trials rely on being stopped early rather than run to completion).
#   params     the actual search space - the settings Optuna is allowed to vary, and the range or
#              choices for each one. `when:` makes a setting only apply in trials where an earlier
#              choice matches - e.g. only search LSTM settings in trials that actually chose the
#              LSTM encoder.
#   derive     named helper rules (defined in hpo/constraints.py) for relationships between
#              settings that are too complex to write directly as a plain search range. Write a
#              bare helper name, or `{name: {option: value}}` to pass it settings of its own.
#
# LAYER WIDTHS: every stack of layers in these models (the head, the static branch, the conv
# blocks) is set as a list of per-layer widths, where the list's length IS the number of layers -
# see the note at the top of models/defaults.yml. Optuna can't directly search a "list" as one
# choice, so there are three ways to handle one of these settings here:
#
#   1. search it   derive: [{dims_pyramid: {key: model.head_hidden_dims, max_depth: 3,
#                                           widths: [32, 64, 128], taper: 0.5, floor: 16}}]
#                  This lets Optuna choose both a depth (how many layers) and a starting width, and
#                  then builds the full list by scaling that width down/up per layer by `taper`:
#                    taper 0.5   each layer roughly half the previous: 128 -> [128, 64, 32]
#                    taper 1.0   every layer the same width: 128 -> [128, 128, 128]
#                    taper 2.0   each layer roughly double: 32 -> [32, 64, 128]
#                  min_depth: 0 allows Optuna to try an empty list (no extra layers at all).
#   2. pin it      fixed: {model.head_hidden_dims: [64, 32]} - always this exact list, not searched
#   3. leave it    don't mention the setting at all, and the registry's own value is used unchanged
#
# Every OTHER width/depth-like setting is just an ordinary number and belongs directly under
# `params`, e.g.: modality_embed_dim, fusion_dim, d_model, nhead, num_layers, time2vec_dim,
# lstm_hidden_dim, lstm_num_layers.
#
# Careful: changing anything in one of these files changes which study `tune.py` continues.
# Studies are named based on a fingerprint of the search space, so editing `params`/`fixed`/`derive`
# starts a brand-new study next time you run `tune.py`, rather than adding more trials to your
# existing one - and trials from the new study won't be directly comparable to the old one's
# results. (Changing `sampler`/`pruner` does NOT trigger a new study, so those can be adjusted
# freely on an existing one.)
#
# Two kinds of setting can't be searched here, and will raise an error if you try:
#   - anything the pipeline works out automatically from your data (static_dim, target_dim,
#     categorical_*, grid_years, target_mean/scale/transform, ...) - letting Optuna choose a
#     different value for these would break the model's expected input/output shapes.
#   - val_size / test_size / seed under `params`, or split_plan anywhere - the train/val/test split
#     is decided ONCE for the whole run (and shared with the sklearn models too) in
#     main_config.yml's `split:` block. Letting it vary per trial would silently refit each trial's
#     preprocessing on different data, making trials impossible to compare fairly with each other
#     or with anything else on the leaderboard.

# --- soil_cnn with the head anchored on an existing prediction (soil_residual_cnn) --------------
# The same search space as soil_cnn.yml, plus a setting for the width of the residual-base block
# (see configs/lightning/models/soil_residual_cnn.yml). Note residual_base_columns itself is NOT
# searched here - which column is the "base" to correct is a fixed choice about your data, not a
# hyperparameter, and letting a trial pick a different one would mean each trial is solving a
# different problem.
# Also note the objective below is a RESIDUAL-space val_loss (the model is scored on how well it
# predicts the correction, not the target itself), so these numbers are not directly comparable to
# the plain soil_cnn study's.
soil_residual_cnn:
  objective:
    metric: val_loss
    direction: minimize
  sampler: {name: tpe, seed: 42}
  pruner: {name: median, n_startup_trials: 5, n_warmup_steps: 10}

  fixed:
    trainer.max_epochs: 100
    datamodule.num_workers: 4
    datamodule.persistent_workers: true
    callbacks.early_stopping.patience: 12
    model.pool: masked_avg
    model.continuous_norm: layer
    model.head_norm_final: true

  params:
    model.learning_rate: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
    model.weight_decay: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
    model.dropout: {type: float, low: 0.2, high: 0.6, step: 0.1}
    model.embedding_dropout: {type: float, low: 0.1, high: 0.4, step: 0.1}
    model.temporal_encoder: {type: categorical, choices: [dilated_tempcnn, annual_grid2d]}
    model.modality_embed_dim: {type: categorical, choices: [32, 64]}
    model.cnn_norm: {type: categorical, choices: [batch, group]}
    model.month_positional: {type: categorical, choices: [true, false]}
    model.use_validity_channels: {type: categorical, choices: [true, false]}
    model.auxiliary_dropout: {type: float, low: 0.1, high: 0.6, step: 0.1}
    model.residual_base_validity_channels: {type: categorical, choices: [true, false]}
    model.residual_base_dropout: {type: float, low: 0.1, high: 0.6, step: 0.1}
    model.scheduler_patience: {type: int, low: 3, high: 8, step: 1}
    datamodule.batch_size: {type: categorical, choices: [64, 128]}

  derive:
    - dims_pyramid: {key: model.head_hidden_dims,   min_depth: 1, max_depth: 3,
                     widths: [64, 128], taper: 0.5, floor: 8}
    - dims_pyramid: {key: model.static_hidden_dims, min_depth: 1, max_depth: 2,
                     widths: [32, 64], taper: 1.0}
    - dims_pyramid: {key: model.cnn_hidden_dims,    min_depth: 1, max_depth: 3,
                     widths: [32, 64], taper: 1.0}
    # min_depth: 0 lets a trial try feeding the residual base value in as-is, with no extra layers.
    # Unlike the equivalent auxiliary_hidden_dims search in soil_cnn.yml, this one always has an
    # effect - the residual-base block is required for this model and always built.
    - dims_pyramid: {key: model.residual_base_hidden_dims, min_depth: 0, max_depth: 1,
                     widths: [16, 32], taper: 1.0}
    # - dims_pyramid: {key: model.auxiliary_hidden_dims, min_depth: 0, max_depth: 2,
                #  widths: [16, 32], taper: 1.0}
