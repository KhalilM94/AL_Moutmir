# Tuned Lightning registry entry, exported from an Optuna study.
#
#   study      : soil_cnn-58e689
#   entry      : soil_cnn
#   trial      : #257 of 283
#   objective  : val_loss = 0.641025 (minimize)
#
# NOTE: that value is the best of many trials, each itself the best epoch of a noisy
# run - a maximum over noise, so it is optimistically biased and a retrain will
# typically fall short of it. `tune.py --rerank-top K` re-runs the shortlist over
# several seeds and reports what a retrain should actually deliver.
#   exported   : 2026-08-15T18:14:33
#   source     : /home/kmisbah/CESBIO/AL_Moutmir/yg-eo-soilnet/configs/lightning/lightning_registry.yml
#
# Compare against the MLflow `val_loss` of the retrained run. NOT r2_score or
# r2_test - those are TEST-split R2 in original units after expm1, a different split, a
# different metric and a different space from anything the study optimized.
#
# Values pinned under `fixed:` in the search space are baked in here too - notably
# trainer.max_epochs, which is the tuning budget. Raise it for a final production run if you
# want early stopping, rather than the epoch budget, to decide when to stop.
#
# Exceptions: num_workers, pin_memory, persistent_workers are restored from the source
# registry. They are throughput knobs that change no result, so production keeps its own.
#
# Train it with:
#   LIGHTNING_MODEL_REGISTRY_PATH=configs/lightning/tuned/soil_cnn-58e689_best.yml python main.py
soil_cnn:
  modeltype: dl
  trainer_args:
    max_epochs: 150
    accelerator: cuda
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    log_every_n_steps: 5
    enable_checkpointing: true
    deterministic: true
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 20
    checkpoint:
      monitor: val_loss
      mode: min
      save_top_k: 1
  datamodule_init_args:
    batch_size: 64
    val_size: 0.2
    test_size: 0.2
    target_transform: log1p
    num_workers: 11
    pin_memory: false
    persistent_workers: false
    seed: 42
    shuffle: true
    max_sequence_length: null
  tags:
    framework: lightning
    family: regression
    architecture: calendar-grid-cnn
  enabled: true
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_cnn_lightning_module.SoilCNNLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto
    target_dim: auto
    modality_dims: auto
    grid_years: auto
    categorical_cardinalities: auto
    categorical_vocabularies: auto
    categorical_feature_names: auto
    embedding_dims: auto
    embedding_max_dim: 50
    embedding_dropout: 0.15000000000000002
    continuous_norm: none
    temporal_encoder: dilated_tempcnn
    cnn_hidden_dims:
    - 128
    - 128
    - 128
    - 128
    - 128
    modality_embed_dim: 128
    cnn_norm: batch
    pool: avg
    month_positional: true
    use_validity_channels: false
    auxiliary_label_columns: [total_silt_pct, c_e_c_meq_100g, c_n_ratio, caco3_pct_total]
    # total_silt_pct, c_e_c_meq_100g, c_n_ratio, caco3_pct_total
    auxiliary_available_names: auto
    auxiliary_validity_channels: true
    auxiliary_hidden_dims: []
    auxiliary_dropout: 0.0
    static_hidden_dims:
    - 64
    - 64
    head_hidden_dims:
    - 256
    - 128
    head_norm_final: true
    dropout: 0.0
    loss_name: mse
    huber_delta: 1.0
    learning_rate: 0.00010038360509669296
    temporal_enabled: true
    optimizer_name: adamw
    weight_decay: 4.3691180514692865e-06
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 10
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
