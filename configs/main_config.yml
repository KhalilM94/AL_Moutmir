common:
  # Every source below is one path that may be a FILE or a FOLDER of files.
  data:
    root: "/home/kmisbah/CESBIO/AL_Moutmir/Soil_Datasets/soil_dataset_20251118_140815"
    # Static features. Targets may live in this same file (joint) or be listed separately below.
    static: 'Morocco_Static_Covariates_Processed_V_310826.csv'
    # static: "Morocco_roadsafe_6k_with_ts_features_and_covariates_V_310826.csv"
    # Omit / leave null when `static` is a joint file that already carries the target columns.
    # Lab targets live in their own file; lat/lon are carried across from it on the join.
    targets: 'Morocco_soil_targets_uuid_roadsafe_6ksample_V_310826.csv'
    # targets: 'Morocco_soil_targets_uuid_roadsafe_6ksample_Prior_Predictions_V_110826.csv'
    
    # Time-series always arrives separately: a single file, or a folder of per-modality shards.
    timeseries: 'Morocco_Soil_Predictors_2017_2025_TS_with_indices_V_310826.csv'
    # Optional index.json listing exact paths per source (static_features / targets / timeseries).
    manifest: null
  POINT_ID_COLUMN: "uuid"
  LAT_COLUMN: "lat"
  LON_COLUMN: "lon"
  RANDOM_SEED: 42
  # TEST_SIZE deliberately absent: the holdout now lives in `split:` below, and having both would
  # give the run two sources of truth for the same number. It is still read as a fallback for
  # configs that predate this block.

  # --- the train/val/test split, decided ONCE for every training family --------------------
  # Previously each family split for itself: sklearn carved 70/30 off the tabular frame while the
  # Lightning datamodules carved 64/16/20 off a bundle rebuilt from the same CSVs. The holdouts
  # overlapped, so a Lightning test point was usually an sklearn TRAINING point - and both families
  # publish the result as `rmse_test` on one leaderboard axis. This block replaces both.
  #
  # The split is keyed on POINT_ID_COLUMN, not on row position: the families disagree about which
  # rows are usable, so positions do not mean the same thing on both sides while a point id does.
  split:
    # random        - i.i.d. holdout over point ids.
    # spatial_group - cluster first, then hold out WHOLE clusters, so no cluster straddles two
    #                 splits. Prefer this when spatial autocorrelation would otherwise let a test
    #                 point be predicted from its neighbour a few metres away in train.
    strategy: random
    # Both are fractions of the FULL eligible population, NOT of the remainder. Asking for 0.2 gets
    # 20%. (The old sequential carve is why the Lightning registry carried the note "without this,
    # train was 0.7*0.7=0.49".) train is whatever is left: 0.64 here.
    test_size: 0.15
    val_size: 0.15
    seed: 42
    # How to handle points only some families can use - the sequence builder drops rows with
    # non-finite covariates that the tabular preprocessor keeps.
    #   intersect  - split over the points EVERY active family can use, so the test set is
    #                identical row for row and metrics are strictly comparable. Costs sklearn rows.
    #   assign_all - label every point; each family takes the subset it holds. Test sets share
    #                membership, but sklearn's is a superset.
    # The per-family delta is logged either way. Flip this key to A/B the two.
    population_policy: intersect
    # Floor on what `intersect` may leave behind, as a fraction of the source frame. Below it the
    # run stops and names the narrowest family instead of quietly training everything on that
    # family's tiny population. Raise it to be stricter; 0 disables the check.
    min_population_ratio: 0.5
    # Path to a previously written data_splits/split_assignments.parquet. Set it to freeze the
    # test set across runs even as the source data grows. null rebuilds the split each run.
    plan_path: null
    # Read only when strategy is spatial_group. Any BaseSpatialClusterStrategy.
    group:
      class_path: yg_eo_soilnet.clustering_utils.KMeansClusterStrategy
      params:
        n_clusters: 12
        # cell_size_m: 5000   # SpatialGridClusterStrategy instead of KMeans

  # --- data quality: one missingness rule for every training family ------------------------
  # A blank covariate used to mean two different things depending on who was reading it. sklearn
  # median-filled it and handed the result to the model as if it were measured; the Lightning
  # builders deleted every affected row. On one real dataset three columns that were 99.7% blank
  # cost the sequence family 5744 of 5761 points - and nothing said so.
  #
  # Now there is one rule, applied by both:
  #   blank on MORE than max_missing_column_ratio of rows -> the run STOPS and names the column
  #   blank on LESS                                       -> median-filled and flagged, row kept
  # A validity flag is carried only for columns that actually have gaps, so a fully populated
  # dataset (like the current one) is completely unaffected.
  data_quality:
    max_missing_column_ratio: 0.2
    # Names exempted from the check: kept and imputed however sparse they are. Use when the
    # imputed value is genuinely wanted, not to silence a warning.
    allow_sparse_columns: []
    # false downgrades the stop to a warning and trains anyway. Off by default because the whole
    # point is that this failure used to be silent.
    fail_on_sparse_columns: true

  FAIL_IF_ALL_MODELS_FAIL_FOR_TARGET: true
  FAIL_ON_MODEL_ERROR: false
  DATA_SPEC_PATH: "data_spec.yml"
  SKLEARN_CONFIG_PATH: "sklearn/config.yml"
  LIGHTNING_CONFIG_PATH: "lightning/config.yml"
  SKLEARN_REGISTRY_PATH: "sklearn/model_registry.yml"
  LIGHTNING_REGISTRY_PATH: "lightning/lightning_registry.yml"
  temporal:
    enabled: true
    # Source path lives under `data.timeseries` above.
    time_column: "observation_date"
    modality_prefix_map:
      s2: "S2_"
      s1_asc: "S1_asc_"
      s1_dsc: "S1_desc_"
      soil: "SOIL_"
      ag: "AG_"
      clim: "CLIM_"
  MAIN_FILE_LOGGING_ENABLED: true
  MLFLOW_EXPERIMENT_EXPORT_ENABLED: false
  MLFLOW_EXPERIMENT_EXPORT_PATH: "mlflow_exports"

  # --- MLflow tracking -------------------------------------------------------
  # Empty means <repo>/mlruns. An experiment's artifact_location is an ABSOLUTE path fixed when the
  # experiment is created, so the original Soil_Model_Training_Experiment - created in a different
  # checkout - has been writing its metadata and its artifacts to two different directories. This
  # experiment is new, so MLflow derives a correct artifact_location under the tracking root below.
  # Old runs are untouched and still readable; comparisons do not span the two.
  MLFLOW_TRACKING_URI: ""
  MLFLOW_EXPERIMENT_NAME: "Soil_Model_Training_v2"
  # Register each fitted model as a new version of <target>_<model>, and move the `champion` alias
  # onto it when its rmse_test beats the version currently aliased. Note the scope: an MLflow alias
  # belongs to ONE registered name, so champion means "the best version of this model on this
  # target", not "the best model for this target" - the leaderboard still decides between soil_cnn
  # and XGBoost. false stops versions accumulating for throwaway experiments.
  MLFLOW_REGISTER_MODELS: true

  # --- Explainability (SHAP) ------------------------------------------------
  # EXPLAIN_ENABLED is the master switch. false skips every explainer and writes no explain/
  # artifacts; training, metrics and every other artifact are untouched, and shap is never
  # imported. Every key here is also settable as an environment variable of the same name.
  EXPLAIN_ENABLED: false
  # Test rows explained. Subsampled deterministically from RANDOM_SEED when the split is larger.
  EXPLAIN_MAX_SAMPLES: 500
  # Reference rows the explainer integrates against. Larger is more stable and slower.
  EXPLAIN_BACKGROUND_SAMPLES: 100
  # Rows drawn in the beeswarm and bar plots. The full unranked table is always written to
  # explain/shap_values.parquet, so this caps the picture and never the data.
  EXPLAIN_MAX_DISPLAY: 25
  # Ceiling on model evaluations for the model-agnostic explainer. Tree and linear models are exact
  # and cheap and ignore this; anything else (TabICL) is estimated first and SKIPPED with the reason
  # recorded in meta/run_summary.json when it would cost more. Raise it to explain an expensive
  # model deliberately, ideally together with a smaller EXPLAIN_MAX_SAMPLES.
  EXPLAIN_MAX_EVALS: 200000
  # [] explains every trained model. Name registry entries to restrict it, e.g. ["XGBoost"].
  EXPLAIN_MODELS: []
  # Never explained unless EXPLAIN_MODELS names them explicitly (an allowlist entry wins over this).
  # TabICL is an in-context learner: a single prediction re-processes the training set, measured at
  # ~13 ms/row against microseconds for a tree, which puts its SHAP run at 13-80 minutes.
  # EXPLAIN_MAX_EVALS counts evaluations and cannot price that, so the exclusion is by name.
  # For reference, XGBoost on the same data measures ~28 s and stays enabled.
  EXPLAIN_SKIP_MODELS: ["TabICL"]
  # false records an explainer failure in meta/run_summary_*.json and keeps the training run.
  EXPLAIN_FAIL_ON_ERROR: false

  # --- Predictive uncertainty ------------------------------------------------
  # Every model here used to emit exactly one number per (sample, target). This block makes it emit
  # a mean AND a standard deviation, and turns that standard deviation into a calibrated interval.
  #
  # Two sources, kept separate all the way to the eval frame because they answer different questions:
  #   epistemic  - spread ACROSS ensemble members. "the models disagree here." Shrinks with data.
  #   aleatoric  - the per-point variance a heteroscedastic head predicts. "the data is noisy here."
  #                Does not shrink with data. Lightning only; see `heteroscedastic` below.
  # total_sigma = sqrt(var(mu_k) + mean(sigma_k^2)), the deep-ensemble decomposition.
  #
  # Neither is trustworthy on its own - an ensemble is systematically overconfident - so the sigma
  # is then CALIBRATED by split conformal against a held-out set. That is what makes the bar on the
  # pred-vs-obs plot mean "95% of observations land in here" rather than "the model felt this sure",
  # and it is what makes a sklearn interval and a Lightning interval the same kind of object.
  # picp_test is logged beside every run so the claim is checkable rather than decorative.
  uncertainty:
    # The master switch. false is not a plot suppressor: no member loop runs, no extra columns are
    # written, and the run costs exactly what it costs today.
    enabled: false
    # Members per model per target group. Training time scales with this LINEARLY - 5 members of a
    # 500-epoch soil_cnn is 5 runs of it. 3 is enough to iterate, 5 to report, 10 to publish.
    # On the Lightning side it also multiplies CHECKPOINT STORAGE by this number: every member logs
    # its own weights, so its predictions can be reconstructed later without the ensemble having to
    # be retrained. A soil_cnn checkpoint is ~75 MB, so 5 members per target is ~375 MB per target.
    n_members: 5
    # Member k trains at RANDOM_SEED + k * this. A stride rather than +1 so a member seed never
    # collides with split.seed or with an entry's own `random_seed`, which would quietly correlate
    # two members that are supposed to be independent draws.
    member_seed_stride: 1000
    # auto | always | never. Members of a DETERMINISTIC estimator (Ridge, PLS - anything with no
    # random_state to set) are otherwise five identical fits: sigma collapses to exactly 0 and the
    # run reports total confidence. `auto` bootstrap-resamples the fit pool for exactly those
    # entries and leaves stochastic ones (XGBoost, GradientBoosting) alone.
    bootstrap: auto
    # Lightning only: the head emits (mu, log var) and the loss becomes beta-NLL instead of MSE.
    # This is the only way to get a bar that is WIDER where the data is noisier rather than merely
    # where the members disagree. Note two consequences: val_loss is then an NLL and is no longer
    # comparable to an MSE run's, and soil_graph does not inherit the shared regression base so it
    # ignores this key and gets ensemble-only uncertainty.
    heteroscedastic: false
    # beta-NLL weight (Seitzer et al. 2022). Plain Gaussian NLL (0.0) is known to stop fitting the
    # mean wherever it has already decided the variance is large, which shows up as a model that
    # gave up on its hard points. 1.0 is fully variance-weighted; 0.5 is the paper's middle.
    beta_nll: 0.5
    # --- what the lower/upper columns and the plotted bars actually are ---------------
    # The sigma columns are written whatever this says. This decides how that sigma becomes an
    # interval, and the three answers are NOT interchangeable:
    #
    #   conformal  mean +- q*sigma, q fitted on held-out residuals. The only one whose coverage is
    #              guaranteed rather than assumed, and the only one that means the same thing on
    #              both training families. The default, and what you want unless you know otherwise.
    #   gaussian   mean +- z(1-alpha/2)*sigma. A normal-theory band. It is a real confidence
    #              interval only if the predictive distribution is Normal AND sigma is on the right
    #              scale - on the Ridge ensemble the fitted conformal q was 50.3 against a Gaussian
    #              1.96, so this would have covered a fraction of what it claims.
    #   sigma      mean +- k*sigma. Claims nothing beyond "k standard deviations", which is the
    #              honest thing to draw when you want the model's own spread rather than a
    #              calibrated band. Graded against what k implies (0.683 at k=1), not against alpha.
    #   none       sigma columns only, no interval, no bars.
    #
    # Only `conformal` needs rows the model never saw - so under gaussian and sigma the sklearn
    # family keeps its full fit pool instead of reserving the val split. See `calibration.source`.
    interval:
      method: sigma
      # Miscoverage rate for conformal and gaussian: 0.05 is a 95% interval. The plotted bar and
      # picp_test both read this, so there is one number behind the picture and the metric that
      # checks it. Ignored by `sigma`.
      alpha: 0.05
      # Half-width in standard deviations, read only by `method: sigma`.
      k: 1.0
    calibration:
      # `method` moved to the `interval` block above, because gaussian and sigma calibrate nothing
      # and naming them a calibration method would be a lie. Setting it here still works - it is
      # read when `interval.method` is absent, with `split_conformal` meaning `conformal`.
      alpha: 0.05
      # WHERE the calibration residuals come from. This is the key with a real cost attached.
      #
      # val     - the val split this file already carves. Honest by construction on the Lightning
      #           side. On the sklearn side X_train is currently train u val (sklearn validates by
      #           k-fold INSIDE that pool), so calibrating on val would calibrate on rows the model
      #           was fitted on and the coverage guarantee would be void. Choosing `val` therefore
      #           moves the sklearn members onto train-only and logs uncertainty_fit_pool=train_only.
      #           Cost: sklearn trains on ~15% fewer rows. Buys: under population_policy=intersect
      #           the two families calibrate on the SAME point ids, so their intervals are directly
      #           comparable - the same property the unified metrics module exists to protect.
      # cv_oof  - out-of-fold residuals from the k-fold GridSearchCV already runs. Costs no rows and
      #           keeps the full fit pool. sklearn only: there is no equivalent for a Lightning run.
      source: val
    # [] applies uncertainty to every enabled entry. Name entries to restrict it.
    models: []
    # Never given an ensemble unless `models` names them explicitly. TabICL is excluded for the same
    # reason it is excluded from SHAP: fit() is a full in-context pass over the training set, and
    # n_members of those is the path that got a run OOM-killed by the kernel twice.
    skip_models: ["TabICL"] #"TabICL"
    # false records the failure in meta/run_summary.json and keeps the point predictions.
    fail_on_error: false

  # --- Per-point prediction export -------------------------------------------
  # One file per run answering "what did every model predict for this point?", keyed on
  # POINT_ID_COLUMN. Two are written to the PARENT run:
  #   predictions/point_predictions_wide.csv   one row per point, one column per <target>__<model>
  #   predictions/point_predictions_long.csv   one row per point x target x model
  # The long file is the authoritative one - target and model names both contain underscores, so a
  # wide column name is readable but not reliably parseable back into its two parts.
  #
  # Where an entry was ensembled the exported number is the ensemble MEAN. No sigma, no interval:
  # this file is about the estimates. The uncertainty lives in eval_results.csv and the
  # uncertainty/ artifacts.
  #
  # Two things to know before reading the output:
  #
  #   * It covers EVERY point the pipeline could featurize, not just the test split - so most rows
  #     are training rows the model has already seen. Their predictions are in-sample and will look
  #     far better than the model's real skill. Nothing in the file marks them; cross-reference
  #     data_splits/split_assignments.parquet, which is keyed on the same point ids, to separate
  #     them.
  #   * It costs a full-population inference pass per model, which nothing else in the run does.
  #     That is why this is off by default and why `skip_models` exists.
  export_point_predictions:
    enabled: false
    # [] exports every model that supports it. Naming entries restricts it, and an entry named here
    # wins over skip_models below.
    models: []
    # A pass over every point with an in-context model is measured in hours - the same reason TabICL
    # is excluded from SHAP and from ensembling.
    skip_models: ["TabICL"] #"TabICL"
    # false records the failure in meta/run_summary.json and keeps the rest of the run.
    fail_on_error: false
