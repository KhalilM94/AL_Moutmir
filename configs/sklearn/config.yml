SPLIT_STRATEGY: "kfold" # "groupkfold" or "kfold"
SKLEARN_FILE_LOGGING_ENABLED: true
MIN_FEATURE_COUNT: 10
MAX_FEATURE_DROP_RATIO_WARNING: 0.9

# r2_train_fit: R2 of the fitted model on its own TRAINING set, an overfitting diagnostic. It costs
# a full extra prediction pass over the train split - several times the test set - which is free for
# a tree and minutes per target for an in-context model like TabICL. Turn it off when fitting slow
# estimators; every other metric is unaffected.
LOG_TRAIN_FIT_METRIC: true
# Per-model opt-out, so the diagnostic stays on for the cheap estimators instead of being turned off
# globally to accommodate one expensive one. TabICL is listed because this pass is the largest
# allocation its run makes: on 2026-08-29 the kernel's OOM killer took the process during exactly
# this step, at 213 features. Same shape and same reasoning as EXPLAIN_SKIP_MODELS.
LOG_TRAIN_FIT_METRIC_SKIP_MODELS: ["TabICL"]

CLUSTERING_STRATEGY:
  enabled: false
  class_path: yg_eo_soilnet.clustering_utils.KMeansClusterStrategy # SpatialGridClusterStrategy / KMeansClusterStrategy
  params:
    n_clusters: 12
    # cell_size_m: 5000

COLUMNS_TO_TRANSFORM: []

categorical:
  TREE_CATEGORICAL_ENCODING: "onehot" # onehot | ordinal | auto
  TREE_ONEHOT_MAX_CATEGORIES: 30

  CATEGORICAL_FEATURES:
    - SU_WRB1_PH

  EXCLUDE_CATEGORICAL:
    # - SU_WRB1_PH

