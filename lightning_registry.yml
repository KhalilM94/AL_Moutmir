ToyRegression:
  enabled: false
  modeltype: dl
  import_path: yg_eo_soilnet.models.lightning_examples.ToyRegressionModule
  datamodule_import_path: yg_eo_soilnet.datamodules.lightning_datamodule.LightningTabularDataModule
  init_args:
    input_dim: null
    output_dim: 1
    hidden_dim: 64
  datamodule_init_args:
    batch_size: 32
    val_size: 0.2
    num_workers: 0
    pin_memory: false
    persistent_workers: false
  trainer_args:
    max_epochs: 25
    accelerator: auto
    devices: auto
    precision: 32-true
  optimizer:
    class_path: torch.optim.Adam
    init_args:
      lr: 0.001
  scheduler: {}
  loss:
    class_path: torch.nn.MSELoss
  metrics:
    - val_loss
    - test_loss
  tags:
    framework: lightning
    family: regression